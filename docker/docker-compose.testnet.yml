# Palimesh 3-Node BFT Testnet
# Usage: docker compose -f docker/docker-compose.testnet.yml up -d

x-node-base: &node-base
  image: ${PALI_NODE_IMAGE:-ghcr.io/palimesh/palimesh-node}:${IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile.node
  restart: unless-stopped
  stop_grace_period: 30s
  networks:
    - palimesh-p2p
    - palimesh-rpc

services:
  node-1:
    <<: *node-base
    container_name: palimesh-node-1
    ports:
      - "28780:18780"
      - "28781:18781"
      - "29780:19780"
      - "29781:19781"
      - "127.0.0.1:9101:9100"
      # IPFS HTTP API (UnixFS /api/v0/add, /api/v0/cat, /ipfs/<cid> gateway).
      # Local-only by default; expose through an authenticated reverse proxy if needed.
      - "127.0.0.1:28786:5001"
    volumes:
      - node1-data:/data/coc
      - ./testnet-configs/node-1.json:/data/coc/node-config.json:ro
    environment:
      - PALI_DATA_DIR=/data/coc
      - PALI_NODE_CONFIG=/data/coc/node-config.json
      - PALI_NODE_KEY=${PALI_NODE1_KEY:?set PALI_NODE1_KEY in the deployment environment}
      # Phase H stability env (defaults to disabled in production):
      #   PALI_DIAG_SPEC_ROOT=1       — enable speculative-compute divergence diagnostics
      #   PALI_DEV_RELAXED_QUORUM=1   — DEV-ONLY 2-of-3 BFT quorum; loses Byzantine safety
      #   PALI_BFT_AUTO_RECOVERY=1    — enable H5 forceSnapSync on persistent divergence
      - PALI_DIAG_SPEC_ROOT=${PALI_DIAG_SPEC_ROOT:-0}
      - PALI_DEV_RELAXED_QUORUM=${PALI_DEV_RELAXED_QUORUM:-0}
      - PALI_BFT_AUTO_RECOVERY=${PALI_BFT_AUTO_RECOVERY:-0}
      - PALI_METRICS_BIND=0.0.0.0

  node-2:
    <<: *node-base
    container_name: palimesh-node-2
    ports:
      - "28782:18780"
      - "28783:18781"
      - "29782:19780"
      - "29783:19781"
      - "127.0.0.1:9102:9100"
    volumes:
      - node2-data:/data/coc
      - ./testnet-configs/node-2.json:/data/coc/node-config.json:ro
    environment:
      - PALI_DATA_DIR=/data/coc
      - PALI_NODE_CONFIG=/data/coc/node-config.json
      - PALI_NODE_KEY=${PALI_NODE2_KEY:?set PALI_NODE2_KEY in the deployment environment}
      - PALI_DIAG_SPEC_ROOT=${PALI_DIAG_SPEC_ROOT:-0}
      - PALI_DEV_RELAXED_QUORUM=${PALI_DEV_RELAXED_QUORUM:-0}
      - PALI_BFT_AUTO_RECOVERY=${PALI_BFT_AUTO_RECOVERY:-0}
      - PALI_METRICS_BIND=0.0.0.0

  node-3:
    <<: *node-base
    container_name: palimesh-node-3
    ports:
      - "28784:18780"
      - "28785:18781"
      - "29784:19780"
      - "29785:19781"
      - "127.0.0.1:9103:9100"
    volumes:
      - node3-data:/data/coc
      - ./testnet-configs/node-3.json:/data/coc/node-config.json:ro
    environment:
      - PALI_DATA_DIR=/data/coc
      - PALI_NODE_CONFIG=/data/coc/node-config.json
      - PALI_NODE_KEY=${PALI_NODE3_KEY:?set PALI_NODE3_KEY in the deployment environment}
      - PALI_DIAG_SPEC_ROOT=${PALI_DIAG_SPEC_ROOT:-0}
      - PALI_DEV_RELAXED_QUORUM=${PALI_DEV_RELAXED_QUORUM:-0}
      - PALI_BFT_AUTO_RECOVERY=${PALI_BFT_AUTO_RECOVERY:-0}
      - PALI_METRICS_BIND=0.0.0.0

  sync-node:
    <<: *node-base
    container_name: palimesh-sync-node
    ports:
      - "18780:18780"
      - "18781:18781"
      - "19880:19780"
      - "19881:19781"
      - "127.0.0.1:9104:9100"
    volumes:
      - sync-data:/data/coc
      - ./testnet-configs/sync-node.json:/data/coc/node-config.json:ro
    environment:
      - PALI_DATA_DIR=/data/coc
      - PALI_NODE_CONFIG=/data/coc/node-config.json
      - PALI_NODE_KEY=${PALI_SYNC_NODE_KEY:?set PALI_SYNC_NODE_KEY in the deployment environment}
      - PALI_DIAG_SPEC_ROOT=${PALI_DIAG_SPEC_ROOT:-0}
      - PALI_DEV_RELAXED_QUORUM=${PALI_DEV_RELAXED_QUORUM:-0}
      - PALI_BFT_AUTO_RECOVERY=${PALI_BFT_AUTO_RECOVERY:-0}
      - PALI_METRICS_BIND=0.0.0.0
    depends_on:
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy
      node-3:
        condition: service_healthy

  explorer:
    image: ${PALI_EXPLORER_IMAGE:-ghcr.io/palimesh/palimesh-explorer}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.explorer
      args:
        NEXT_PUBLIC_RPC_URL: http://node-1:18780
        NEXT_PUBLIC_WS_URL: ws://node-1:18781
    container_name: palimesh-explorer
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      node-1:
        condition: service_healthy
    networks:
      - palimesh-rpc
    restart: unless-stopped

  faucet:
    image: ${PALI_FAUCET_IMAGE:-ghcr.io/palimesh/palimesh-faucet}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.faucet
    container_name: palimesh-faucet
    ports:
      - "3003:3003"
    environment:
      - PALI_FAUCET_RPC_URL=http://node-1:18780
      - PALI_FAUCET_PRIVATE_KEY=${PALI_FAUCET_KEY:?set PALI_FAUCET_KEY in the deployment environment}
    depends_on:
      node-1:
        condition: service_healthy
    networks:
      - palimesh-rpc
    restart: unless-stopped

  # Phase C PoSe v2 prover sidecars.
  # Each prover serves /pose/challenge + /pose/receipt for ONE validator
  # using that validator's private key. The prover reads chunk bytes from
  # the validator's blockstore (storage/blocks subdir) to build live
  # Merkle proofs for storage challenges.
  #
  # ⚠️ Volume MUST be mounted :ro. Sharing a RW volume with the validator
  # caused a 95-min testnet halt on 2026-04-25 (see
  # docs/incident-2026-04-25-chain-halt-post-mortem-{zh,en}.md).
  # LevelDB does not safely tolerate two processes opening the same DB
  # files even if only one writes; cross-container lock semantics under
  # force-recreate are unreliable.
  prover-1: &prover-base
    image: ${PALI_RUNTIME_IMAGE:-ghcr.io/palimesh/palimesh-runtime}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    container_name: palimesh-prover-1
    command: ["runtime/palimesh-node.ts"]
    environment:
      - PALI_CONFIG=/app/config.json
      - PALI_NODE_KEY=${PALI_NODE1_KEY:?set PALI_NODE1_KEY in the deployment environment}
      - PALI_RPC_URL=http://node-1:18780
    volumes:
      - node1-data:/data/coc:ro    # ← :ro is mandatory; see header comment
      - ./testnet-runtime-configs/provers/node-1.json:/app/config.json:ro
    ports:
      - "127.0.0.1:19901:18800"
    networks:
      palimesh-rpc:
        aliases:
          - prover-1   # agent.json's nodeEndpoints reference http://prover-1:18800
    depends_on:
      node-1:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - pose

  prover-2:
    <<: *prover-base
    container_name: palimesh-prover-2
    environment:
      - PALI_CONFIG=/app/config.json
      - PALI_NODE_KEY=${PALI_NODE2_KEY:?set PALI_NODE2_KEY in the deployment environment}
      - PALI_RPC_URL=http://node-2:18780
    volumes:
      - node2-data:/data/coc:ro
      - ./testnet-runtime-configs/provers/node-2.json:/app/config.json:ro
    ports:
      - "127.0.0.1:19902:18800"
    networks:
      palimesh-rpc:
        aliases:
          - prover-2
    depends_on:
      node-2:
        condition: service_healthy

  prover-3:
    <<: *prover-base
    container_name: palimesh-prover-3
    environment:
      - PALI_CONFIG=/app/config.json
      - PALI_NODE_KEY=${PALI_NODE3_KEY:?set PALI_NODE3_KEY in the deployment environment}
      - PALI_RPC_URL=http://node-3:18780
    volumes:
      - node3-data:/data/coc:ro
      - ./testnet-runtime-configs/provers/node-3.json:/app/config.json:ro
    ports:
      - "127.0.0.1:19903:18800"
    networks:
      palimesh-rpc:
        aliases:
          - prover-3
    depends_on:
      node-3:
        condition: service_healthy

  agent:
    image: ${PALI_RUNTIME_IMAGE:-ghcr.io/palimesh/palimesh-runtime}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    container_name: palimesh-agent
    command: ["runtime/palimesh-agent.ts"]
    environment:
      - PALI_DATA_DIR=/data/coc/runtime
      - PALI_CONFIG=/data/coc/runtime/agent.json
      - PALI_OPERATOR_PK=${PALI_OPERATOR_PK:?set PALI_OPERATOR_PK in the deployment environment}
    volumes:
      - runtime-data:/data/coc/runtime
      - ./testnet-runtime-configs/agent.json:/data/coc/runtime/agent.json:ro
    depends_on:
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy
      node-3:
        condition: service_healthy
    networks:
      - palimesh-rpc
    restart: unless-stopped
    profiles:
      - pose

  relayer:
    image: ${PALI_RUNTIME_IMAGE:-ghcr.io/palimesh/palimesh-runtime}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    container_name: palimesh-relayer
    command: ["runtime/palimesh-relayer.ts"]
    environment:
      - PALI_DATA_DIR=/data/coc/runtime
      - PALI_CONFIG=/data/coc/runtime/relayer.json
      # Must match the operational owner/slasher for the deployed PoSeManagerV2.
      - PALI_SLASHER_PK=${PALI_SLASHER_PK:?set PALI_SLASHER_PK in the deployment environment}
    volumes:
      - runtime-data:/data/coc/runtime
      - ./testnet-runtime-configs/relayer.json:/data/coc/runtime/relayer.json:ro
    depends_on:
      node-1:
        condition: service_healthy
      agent:
        condition: service_started
    networks:
      - palimesh-rpc
    restart: unless-stopped
    profiles:
      - pose

volumes:
  node1-data:
  node2-data:
  node3-data:
  sync-data:
  runtime-data:

networks:
  palimesh-p2p:
    driver: bridge
    internal: true
    name: docker_coc-p2p
  palimesh-rpc:
    driver: bridge
    name: docker_coc-rpc
