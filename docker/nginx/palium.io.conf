# palium.io 五域名 vhost 模板(v3 生产参考;certbot --nginx 会自动补 443 与 80→443 跳转)
# 安装: cp 到 /etc/nginx/sites-available/palium.io.conf && ln -s 到 sites-enabled
# 取证: certbot --nginx -d palium.io -d www.palium.io -d explorer.palium.io -d faucet.palium.io -d rpc.palium.io --redirect
# 后端与 palimesh.io.conf 完全相同:只有一条链(88780),两站共用 explorer/faucet/rpc;唯一区别是 apex → 3004(palium-website.service)

server {
    listen 80;
    server_name palium.io www.palium.io;
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name explorer.palium.io;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name faucet.palium.io;
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name rpc.palium.io;
    location /ws {
        proxy_pass http://127.0.0.1:28790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:28780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }
}
